bio: |
  Jacqueline Lease is an Assistant Professor at the Collaborative Research
  Centre for Green Materials on Environmental Technology, Kyushu Institute
  of Technology. Her research focuses on cellulose modification chemistry —
  mechanochemical esterification, phosphorylation, and citric acid
  crosslinking — turning agricultural and forestry waste into functional,
  bio-based materials. She has 35+ peer-reviewed publications and 400+
  citations, and works under Prof. Yoshito Ando in the Ando Laboratory.

